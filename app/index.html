  <div id="app">
    <header class="topbar">
      <div>
        <div class="brand">مَطْبَخ <span>♥</span></div>
        <div class="subtitle">Carnet de cuisine de la maison</div>
      </div>
      <div class="top-actions"><button class="icon-btn" onclick="showConverter()" title="Convertisseur">↔</button><button class="icon-btn" onclick="showSeasonPicker()" title="Changer la saison">🌿</button><button class="icon-btn" onclick="showDataManager()" title="Sauvegarder ou restaurer">💾</button></div>
    </header>

    <main id="main">
      <section id="home" class="view active"></section>
      <section id="meals" class="view"></section>
      <section id="recipes" class="view"></section>
      <section id="stock" class="view"></section>
      <section id="shopping" class="view"></section>
    </main>

    <nav class="bottom-nav">
      <button data-view="home" class="nav-btn active"><span><svg viewBox="0 0 24 24"><use href="#icon-home"></use></svg></span><small>Accueil</small></button>
      <button data-view="meals" class="nav-btn"><span><svg viewBox="0 0 24 24"><use href="#icon-calendar"></use></svg></span><small>Repas</small></button>
      <button data-view="recipes" class="nav-btn"><span><svg viewBox="0 0 24 24"><use href="#icon-book"></use></svg></span><small>Recettes</small></button>
      <button data-view="stock" class="nav-btn"><span><svg viewBox="0 0 24 24"><use href="#icon-pantry"></use></svg></span><small>Stock</small></button>
      <button data-view="shopping" class="nav-btn"><span><svg viewBox="0 0 24 24"><use href="#icon-basket"></use></svg></span><small>Courses</small></button>
    </nav>
  </div>

  <div id="modalRoot"></div>
  <script>
  window.__matbakhBootStart = performance.now();
  window.__matbakhBootFinished = false;
  window.addEventListener('error', function(event){
    if(window.__matbakhBootFinished) return;
    var main=document.getElementById('main');
    var splash=document.getElementById('splash');
    if(splash) splash.classList.add('is-hidden');
    if(main && !main.dataset.fatal){
      main.dataset.fatal='1';
      var msg=(event && event.error && event.error.message) || (event && event.message) || 'Erreur JavaScript inconnue';
      main.innerHTML='<div class="card empty"><h2>Un problème est survenu au démarrage</h2><p class="muted">'+String(msg).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})+'</p><button class="btn" onclick="location.reload()">Recharger</button></div>';
    }
  });
  window.setTimeout(function(){
    var splash=document.getElementById('splash');
    if(splash && !window.__matbakhBootFinished){ splash.classList.add('is-hidden'); }
  }, 1250);
  window.setTimeout(function(){
    if(window.__matbakhBootFinished) return;
    var main=document.getElementById('main');
    if(main && !main.dataset.fatal && !main.querySelector('.view:not(:empty)')){
      main.dataset.fatal='1';
      main.innerHTML='<div class="card empty"><h2>Matbakh met plus de temps que prévu</h2><p class="muted">La base locale ou le script de l’application n’a pas terminé son chargement. Rechargez la page. Si le problème revient, fermez les autres onglets Matbakh puis rechargez.</p><button class="btn" onclick="location.reload()">Recharger</button></div>';
    }
  }, 3800);
</script>
